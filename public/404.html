<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>EarnFlow.in | Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA single page app redirect script
      // Preserves path, search, and hash so that direct URLs like /legal/privacy load smoothly
      var l = window.location;
      var cleanPath = l.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();

      // Static routes redirection
      if (cleanPath === 'legal/privacy' || cleanPath === 'privacy' || cleanPath === 'privacy-policy') {
        l.replace('/legal/privacy/index.html' + l.search + l.hash);
      } else if (cleanPath === 'legal/terms' || cleanPath === 'terms' || cleanPath === 'terms-and-conditions') {
        l.replace('/legal/terms/index.html' + l.search + l.hash);
      } else if (cleanPath === 'contact') {
        l.replace('/contact/index.html' + l.search + l.hash);
      } else {
        // Fallback to root SPA with query param
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/?p=' + encodeURIComponent(l.pathname.slice(1)) +
          (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body style="background:#0b0e14; color:#f5c451; font-family:sans-serif; text-align:center; padding-top:20vh;">
    <p>Redirecting to EarnFlow.in...</p>
  </body>
</html>
